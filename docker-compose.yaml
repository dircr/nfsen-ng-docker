services:

  caddy:
    # Pinned by digest: tags move, digests do not. Bump together with caddy's
    # Caddyfile compatibility — see "Upgrading" in README.md.
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    ports:
      # Bind to loopback by default: the UI is not meant to be reachable from
      # the LAN unless asked for. Set WEB_BIND_ADDR=0.0.0.0 (or a LAN address)
      # in .env to expose it. See "Security" in README.md.
      - "${WEB_BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${WEB_BIND_ADDR:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      # a directory mount, like the other services: single-file bind mounts are
      # unreliable on some daemons (colima/lima handed over an empty directory)
      - ./caddy:/etc/caddy:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    environment:
      AUTH_USER: ${AUTH_USER:?AUTH_USER is required (see .env.example)}
      AUTH_PASS_HASH: ${AUTH_PASS_HASH:?AUTH_PASS_HASH is required (see .env.example)}
      DOMAIN: ${DOMAIN:-localhost}
      # certificate to serve when the client sends no SNI — only needed when
      # DOMAIN is a bare IP (browsers send no SNI for IP literals)
      CADDY_DEFAULT_SNI: ${CADDY_DEFAULT_SNI:-localhost}
      # used by the Caddyfile's HTTP→HTTPS redirect: it has to name the port
      # that is actually published on the host
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      TZ: ${TZ:-UTC}
    # access log (JSON) is written to /data/access.log inside this volume —
    # see the log block in caddy/Caddyfile
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-5}"
    restart: unless-stopped
    init: true
    depends_on:
      nfsen:
        condition: service_healthy
    healthcheck:
      # Probes the :80 listener, which answers 301 to the published HTTPS port.
      # The admin API is off (see caddy/Caddyfile), and probing the TLS site is
      # not an option: this image's busybox wget has no way to skip certificate
      # verification, so an https:// probe fails on the self-signed cert instead
      # of reporting the real state. A 301 proves the process is alive *and*
      # that the Caddyfile is loaded.
      test: ["CMD-SHELL", "wget -qS -O /dev/null http://127.0.0.1:80/ 2>&1 | grep -q '301'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind :80 and :443
    # raise these if Caddy gets OOM-killed or throttled under many clients
    mem_limit: 256m
    cpus: ${CADDY_CPUS:-1.0}
    pids_limit: 128
    networks:
      - nfsen-net

  nfsen:
    build:
      context: .
      dockerfile: nfsen-ng/Dockerfile
    depends_on:
      # the import daemon watches profiles-data/live; start once the collectors
      # run so those directories exist on the first scan
      nfdump:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      # the collectors write their capture files in TZ; nfsen-ng's Health page
      # cross-checks the two and warns when they differ
      NFCAPD_TZ: ${TZ:-UTC}
      # capture tree inside this container (see the volumes below)
      NFSEN_NFDUMP_PROFILES: /data/nfsen-ng
      NFSEN_IMPORT_YEARS: ${NFSEN_IMPORT_YEARS:-3}
      NFSEN_TOPN_RETENTION_DAYS: ${NFSEN_TOPN_RETENTION_DAYS:-31}
      # service ports the UI offers in its per-port views
      NFSEN_PORTS: ${NFSEN_PORTS:-80,443,22,53}
      NFSEN_LOG_LEVEL: ${NFSEN_LOG_LEVEL:-info}
      # NFSEN_SOURCES is derived from conf/sources.conf by the entrypoint
    volumes:
      # Read-only on purpose: the UI reads capture files and never writes them
      # (no nfexpire call, no unlink/rmdir/mkdir on this path — checked against
      # the app source). With write access a compromised UI could tamper with
      # or delete the flow records the analysis is based on.
      - ./profiles-data:/data/nfsen-ng:ro
      # a directory mount: a single-file bind mount is not reliable on
      # every daemon (colima/lima can present the host file as a directory)
      - ./conf:/etc/nfsen:ro
      # RRD databases + SQLite store (preferences, saved filters, alert
      # history, top-N data). Survives image upgrades — back this up.
      - ./nfsen-state:/var/lib/nfsen-ng
    # php-via serves the UI and its static assets itself; Caddy reaches it on
    # the compose network only, so nothing is published to the host here.
    expose:
      - "9000"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-5}"
    restart: unless-stopped
    init: true
    # Same uid as the collector: it owns the capture files (0644/0755) and the
    # nfsen-state volume, so reading them needs no capability at all. Running
    # this container as root only papered over file ownership — port 9000 is
    # unprivileged and spawning nfdump does not require root either. Upgrading
    # an existing install on Linux: chown -R 1000:1000 nfsen-state once.
    user: "1000:1000"
    cap_drop:
      - ALL
    # Root filesystem read-only: everything the app writes lives on the two
    # volumes (state) or in /tmp (Swoole's log). Writes into the image itself
    # were checked against the app source — none. tmpfs mode 1777 because
    # tmpfs defaults to 0755 on some runc versions, which would deny uid 1000.
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    # raise these if the import daemon cannot keep up with many sources
    mem_limit: 1g
    cpus: ${NFSEN_CPUS:-2.0}
    pids_limit: 256
    healthcheck:
      # One process serves everything. Probe a static asset (favicon.svg, 657 B)
      # over HTTP: a bare TCP connect would report a hung worker as healthy, and
      # a page render would cost an nfdump run every 30s.
      test: ["CMD-SHELL", "curl -fsS --max-time 4 -o /dev/null http://127.0.0.1:9000/favicon.svg"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - nfsen-net

  nfdump:
    build:
      context: .
      dockerfile: nfdump/Dockerfile
    user: "1000:1000"
    read_only: true
    # scratch space (validated sources copy). The tmpfs mode is set
    # explicitly to 1777 (the long-standing default): runc 1.3.3 briefly
    # defaulted tmpfs to 0755 (fixed in runc 1.3.4 / Docker 29.1.2), which
    # denied uid 1000 writes to /tmp. services.tmpfs has no mode field, so
    # this uses the volumes long syntax.
    volumes:
      - ./profiles-data:/data
      # a directory mount: a single-file bind mount is not reliable on
      # every daemon (colima/lima can present the host file as a directory)
      - ./conf:/etc/nfsen:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          # decimal YAML ints pass straight to os.FileMode; the 0o prefix
          # spells out the octal value
          mode: 0o1777
    ports:
      # open by default: the routers have to reach the collectors. Narrow it
      # to the LAN address in .env (see "Security" in README.md).
      - "${FLOW_BIND_ADDR:-0.0.0.0}:${UDP_PORT_RANGE:-9000-9099}:9000-9099/udp"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-5}"
    environment:
      TZ: ${TZ:-UTC}
      FLOW_RETENTION_DAYS: ${FLOW_RETENTION_DAYS:-30}
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # raise these if collectors are killed or throttled
    mem_limit: 512m
    cpus: ${NFDUMP_CPUS:-1.0}
    pids_limit: 128
    # nfcapd needs a moment to flush the current file on SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "pgrep", "-f", "fcapd"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nfsen-net

networks:
  # A named network, so the stack stays isolated from other compose projects on
  # the same daemon.
  #
  # NOT `internal: true`, deliberately. An internal network has no gateway, and
  # Docker (29.x on Linux) then publishes *no* ports for the containers on it:
  # HostConfig.PortBindings still carries the mapping, but NetworkSettings.Ports
  # comes back null for every port, no DNAT rule and no docker-proxy are created,
  # and the outside world gets "connection refused" while every container reports
  # healthy. Learned the hard way on a real daemon — a VM-based engine publishes
  # anyway, which is how it slipped through the smoke test here.
  #
  # Block egress at the firewall instead (Docker's DOCKER-USER chain, or
  # firewall/nftables-nfsen.nft) if that is what you want.
  nfsen-net: {}
