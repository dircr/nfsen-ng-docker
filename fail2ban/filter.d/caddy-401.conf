[Definition]
#
# Failed Caddy basic-auth attempts. Caddy writes one JSON object per request:
#
#   {"level":"info","ts":1795280225.28,"logger":"http.log.access.log0",
#    "msg":"handled request",
#    "request":{"remote_ip":"172.18.0.1","remote_port":"44088",…,"headers":{…}},
#    "bytes_read":0,"user_id":"","duration":0.0009,"size":0,"status":401,…}
#
# Two traps in that layout — both were measured against a real log, and both
# made an earlier version of this filter match 0 of 97 recorded 401s:
#
# 1. `remote_ip` lives INSIDE the `request` object, while `status` is a
#    top-level key that comes AFTER that object closes. A `[^}]*` between them
#    can never match: it would have to cross the `}` closing `request`. Use
#    `.*` — fail2ban works line by line, so it cannot spill into the next
#    request.
#
# 2. fail2ban matches the failregex against the REST OF THE LINE after the
#    date match. With the `datepattern` below, the line handed to the regex
#    starts at `"level":"info",…` — so an anchored `^\{"level":"info"…`
#    matches nothing. The regexes below are therefore NOT anchored. Keep it
#    that way if you edit them.
#
# Both alternations are listed so a future Caddy release that reorders the
# fields keeps working. fail2ban treats each line as a separate regex, so a
# given log line can match at most once.

failregex = "remote_ip":"<HOST>".*"status":401
            "status":401.*"remote_ip":"<HOST>"

# `ts` is a float epoch (1795280225.2888997); `\d+` truncates the fraction and
# what remains parses as epoch seconds.
datepattern = ^\{"level":"info","ts":(?P<time>\d+)
